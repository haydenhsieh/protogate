[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "protogate"
version = "0.1.0"
description = "Host API and CLI for the LinkIt 7697 ProtoGate firmware"
requires-python = ">=3.9"

[project.optional-dependencies]
serial = ["pyserial>=3.5"]

[project.scripts]
protogate = "protogate.cli:main"

[tool.setuptools]
package-dir = {"" = "host"}

[tool.setuptools.packages.find]
where = ["host"]
